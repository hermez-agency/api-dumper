openapi: 3.1.0
info:
  title: Petstore
  version: 1.0.0
paths:
  /pets:
    get:
      responses:
        "200":
          description: The pets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pet"
            text/csv:
              schema:
                type: string
  /internal/health:
    get:
      responses:
        "204":
          description: OK
components:
  schemas:
    PetStatus:
      type: string
      enum: [available, pending, sold, null]
    Priority:
      type: integer
      enum: [1, 2, 3]
      x-enum-varnames: [LOW, MEDIUM, HIGH]
    Pet:
      type: object
      required: [name]
      properties:
        name:
          type: string
        status:
          $ref: "#/components/schemas/PetStatus"
        size:
          type: string
          enum: [small, large]
        tags:
          type: array
          items:
            type: string
            enum: [cute, loud]
